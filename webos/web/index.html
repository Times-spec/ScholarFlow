<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f6f4f" />
  <title>随行 · 智能游览助手</title>
  <link rel="stylesheet" href="/css/app.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
</head>
<body>
  <div id="app">
    <header id="app-header">
      <div class="brand" data-nav="#/">随行<span class="brand-sub">智能游览</span></div>
      <nav class="top-nav">
        <button class="nav-btn" data-nav="#/discover" data-navmatch="discover city venue venues search template itinerary">发现</button>
        <button class="nav-btn" data-nav="#/" data-navmatch="home">规划</button>
        <button class="nav-btn" data-nav="#/me" data-navmatch="me">我的</button>
      </nav>
    </header>
    <div id="demo-banner" class="demo-banner hidden"></div>
    <main id="view"></main>
    <div id="sheet" class="sheet hidden"><div class="sheet-mask"></div><div class="sheet-body" id="sheet-body"></div></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  </div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
